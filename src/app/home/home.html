<app-relogio></app-relogio>

<div class="wrapper-geral">

  <!-- Bloco da Esquerda: Card com Discos e Badge -->
  <div class="card-container">
    <div class="fileira-discos" [routerLink]="['/musicas']">
      <img src="/Disco.svg" alt="Disco decorativo na fileira de discos do card do próximo sinal" class="disco">
      <img src="/Disco.svg" alt="Disco decorativo na fileira de discos do card do próximo sinal" class="disco">
      <img src="/Disco.svg" alt="Disco decorativo na fileira de discos do card do próximo sinal" class="disco">
      <img src="/Disco.svg" alt="Disco decorativo na fileira de discos do card do próximo sinal" class="disco">
    </div>

    <div class="badge-topo">
      Próximo Sinal :
    </div>

    <div class="card-principal">
      <div class="info-musica">
        <div class="titulo-musica">Música 01</div>
        <div class="subtitulo-playlist">Playlist 01</div>
      </div>
      
      <!-- Botão Play/Pause controlado pelo Angular -->
      <button 
        class="icone-play" 
        [class.tocando]="isTocando" 
        (click)="togglePlayPause()">
      </button>
    </div>
  </div>

  <!-- Bloco da Direita: Botão do Calendário (SEPARADO do card-container) -->
  <div class="Calendario" title="Calendário" [routerLink]="['/calendario']">
    <img src="/Calendario.svg" alt="Calendário para acessar a agenda escolar, ao lado do card do próximo sinal" class="icon_calendario">
  </div>

</div>
