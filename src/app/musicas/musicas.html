<main class="conteudo-principal">
  
  <!-- 1. Bloco da Playlist (Título + Disco) -->
  <div class="bloco-playlist">
    <div class="caixa-disco-01">
      <span id="nome-playlist">{{ playlistSelecionada }}</span>
    </div>
    <div class="caixa-disco-02"></div>
    <img src="Disco.svg" class="Discao" alt="Disco">
  </div>

  <!-- Seletor de Playlists (Aparece se houver mais de uma) -->
  <div class="seletor-playlist" *ngIf="playlists.length > 1">
    <label for="select-playlist">Selecionar Playlist: </label>
    <select id="select-playlist" [(ngModel)]="playlistSelecionada">
      <option *ngFor="let p of playlists" [value]="p">{{ p }}</option>
    </select>
  </div>

  <!-- 2. Grupo de Botões -->
  <div class="grupo-botoes">
    <!-- EVENTO DE CLIQUE AQUI: (click)="abrirModal()" -->
    <button class="btn-acao" (click)="abrirModal()">Adicionar</button>
    <button class="btn-acao" (click)="excluirPlaylist()">Excluir</button>
    <button class="btn-acao">Editar</button>
  </div>

</main>

<!-- 3. Modal que só abre quando o utilizador clica em "Adicionar" -->
<div class="modal-overlay" *ngIf="modalAberto">
  <div class="modal-conteudo">
    <h3>Criar Nova PlayList</h3>
    
    <input 
      type="text" 
      placeholder="Digite o nome da playlist..." 
      [(ngModel)]="novoNomePlaylist" 
      (keyup.enter)="adicionarPlaylist()"
      autofocus
    />

    <div class="modal-botoes">
      <button class="btn-acao" (click)="adicionarPlaylist()">Salvar</button>
      <button class="btn-acao btn-cancelar" (click)="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>
