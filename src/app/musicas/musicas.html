<!-- Fundo fixo desacoplado (imune a zoom/escala do conteúdo) -->
<div class="bg-fixo"></div>

<!-- Cabeçalho com o botão de voltar -->
<header class="header-container">
  <button class="btn-acao btn-voltar" (click)="voltar()">← Voltar</button>
</header>

<main class="conteudo-principal">
  
  <!-- Lista de Playlists -->
  <div 
    class="bloco-playlist" 
    *ngFor="let p of playlists; let i = index"
    [class.selecionada]="i === indexAtual"
    (click)="selecionarPlaylist(i)"
  >
    <div class="caixa-disco-01">
      <span id="nome-playlist">{{ p }}</span>
    </div>
    <div class="caixa-disco-02"></div>
    <img src="Disco.svg" class="Discao" alt="Disco">
  </div>

  <!-- Grupo de Botões -->
  <div class="grupo-botoes">
    <button class="btn-acao" (click)="abrirModalAdicionar()">Adicionar</button>
    <button class="btn-acao" (click)="abrirModalExcluir()">Excluir</button>
    <button class="btn-acao" (click)="abrirModalEditar()">Editar</button>
  </div>

</main>

<!-- Modal Criar / Editar -->
<div class="modal-overlay" *ngIf="modalAberto">
  <div class="modal-conteudo">
    <h3>{{ modoEdicao ? 'Editar Playlist' : 'Criar Nova Playlist' }}</h3>
    
    <input 
      type="text" 
      placeholder="Digite o nome da playlist..." 
      [(ngModel)]="novoNomePlaylist" 
      (keyup.enter)="salvarPlaylist()"
      autofocus
    />

    <div class="modal-botoes">
      <button class="btn-acao" (click)="salvarPlaylist()">Salvar</button>
      <button class="btn-acao btn-cancelar" (click)="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal para Escolher e Excluir Playlist -->
<div class="modal-overlay" *ngIf="modalExcluirAberto">
  <div class="modal-conteudo">
    <h3>Excluir Playlist</h3>
    
    <label for="select-excluir" style="font-size: 14px; color: #555;">
      Selecione qual playlist deseja remover:
    </label>
    
    <select 
      id="select-excluir" 
      [(ngModel)]="indexExcluir"
      style="padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; outline: none;"
    >
      <option *ngFor="let p of playlists; let i = index" [value]="i">
        {{ p }}
      </option>
    </select>

    <div class="modal-botoes">
      <button class="btn-acao btn-excluir-modal" (click)="confirmarExclusao()">Excluir</button>
      <button class="btn-acao btn-cancelar" (click)="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>
